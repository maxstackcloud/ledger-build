name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  
  workflow_dispatch:
   inputs:
     ECRURL:
      description: "ECR Registry URL"
      required: true
      default: "081654307023.dkr.ecr.ap-south-1.amazonaws.com"

     APPREPO:
      description: "Docker Repo Name"
      required: true
      default: "wezvatechbackend"

     REGION:
      description: "AWS Region"
      required: true
      default: "ap-south-1"

     deploybuild:
      description: "Trigger Deployment"
      required: false
      default: "false"    

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify files
        run: |
          echo "Repository successfully checked out"
          ls -R

      # -----------------------------
      # Setup Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -----------------------------
      # Build Spring Boot Jar
      # -----------------------------
      - name: Build Spring Boot Jar
        run: mvn clean package -Dmaven.test.skip=true

      - name: Rename Artifact
        run: cp target/*.jar target/backend_fb${{ github.run_number }}.jar

      # -----------------------------
      # Code Coverage Report (JaCoCo)
      # -----------------------------
      - name: Code Coverage Report (JaCoCo)
        run: mvn clean verify -Ddependency-check.skip=true

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # -----------------------------
      # OWASP Dependency Check (SCA)
      # -----------------------------
      - name: Trivy FS Scan (SCA)
        continue-on-error: true
        run: |
          mkdir -p trivy-report
          
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v ${{ github.workspace }}/trivy-report:/report \
            aquasec/trivy:0.50.0 \
            fs /project \
            --format json \
            --output /report/trivy-report.json

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ./trivy-report

      # -----------------------------
      # SonarCloud SAST Scan (main branch only)
      # -----------------------------
      - name: SonarCloud SAST Scan
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.scm }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=wezva-fintech_ledger-build \
            -Dsonar.organization=wezva-fintech \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true #For quality gate

      # -----------------------------
      # Configure AWS Credentials
      # -----------------------------     
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.REGION || 'ap-south-1' }}

      # -----------------------------
      # Login to Amazon ECR
      # -----------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 

      # -----------------------------
      # Build & Push Docker Image
      # ----------------------------- 
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ inputs.ECRURL || '081654307023.dkr.ecr.ap-south-1.amazonaws.com' }}
          REPOSITORY: ${{ inputs.APPREPO || 'wezvatechbackend' }}
          IMAGE_TAG: fb${{ github.run_number }}
        run: |
          echo "Building Docker Image..."
          docker build -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG .
          echo "Pushing Docker Image..."
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG

      # -----------------------------
      # Scan Docker Image (Trivy)
      # -----------------------------
      - name: Scan Docker Image (Trivy)
        env:
          REPOSITORY: ${{ inputs.APPREPO || 'wezvatechbackend' }}
          IMAGE_TAG: fb${{ github.run_number }}
        run: |
          echo "Scanning Image for Vulnerabilities..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.50.0 image \
            --scanners vuln \
            $REPOSITORY:$IMAGE_TAG > trivyresults.txt

      # -----------------------------
      # Dockerfile Lint (Hadolint)
      # -----------------------------
      - name: Dockerfile Lint (Hadolint)
        run: |
          echo "Analyzing Dockerfile best practices..."
          docker run --rm -i hadolint/hadolint < Dockerfile | tee dockerlinter.log

      # -----------------------------
      # Upload Scan Reports (Optional but Recommended)
      # -----------------------------
      - name: Upload Scan Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivyresults.txt
            dockerlinter.log

      # -----------------------------
      # Cleanup Docker Image
      # -----------------------------
      - name: Cleanup Docker Image
        if: always()
        env:
          REPOSITORY: ${{ inputs.APPREPO || 'wezvatechbackend' }}
          IMAGE_TAG: fb${{ github.run_number }}
        run: |
          docker rmi $REPOSITORY:$IMAGE_TAG || true
            
