name: Ledger feature build and security gates

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:
    inputs:
      ECRURL:
        description: "ECR registry hostname (no https:// or repository path)"
        type: string
        required: true
      APPREPO:
        description: "Existing ECR repository name"
        type: string
        required: true
      REGION:
        description: "AWS region containing the repository"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-and-scan:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ECR_REGISTRY: ${{ inputs.ECRURL || vars.ECRURL }}
      ECR_REPOSITORY: ${{ inputs.APPREPO || vars.APPREPO }}
      AWS_REGION: ${{ inputs.REGION || vars.REGION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      IMAGE_TAG: fb${{ github.run_number }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and history for Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          for key in ECR_REGISTRY ECR_REPOSITORY AWS_REGION SONAR_PROJECT_KEY SONAR_ORGANIZATION SONAR_TOKEN AWS_ROLE_ARN AWS_ACCOUNT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing configuration: $key"
              exit 1
            fi
          done
          [[ "$ECR_REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$ECR_REGISTRY" == "$AWS_ACCOUNT_ID".dkr.ecr.* ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REGISTRY" == *.dkr.ecr."$AWS_REGION".amazonaws.com ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check runner tools and install containerized Trivy
        run: |
          java -version
          mvn --version
          docker info
          aws --version
          jq --version
          docker pull "$TRIVY_IMAGE"
          docker run --rm "$TRIVY_IMAGE" --version

      - name: Build, test with MySQL Testcontainers, and generate JaCoCo
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          test -s target/site/jacoco/jacoco.xml
          test -s target/app.jar

      - name: Trivy SCA of packaged application dependencies
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            "$TRIVY_IMAGE" fs /project/target/app.jar \
            --scanners vuln --severity HIGH,CRITICAL \
            --format json --output /reports/trivy-sca.json --exit-code 1

      - name: SonarCloud SAST and blocking quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ github.ref_name }}
        run: |
          mvn --batch-mode --no-transfer-progress sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.branch.name="$SONAR_BRANCH" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

      - name: Upload build and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/site/jacoco/
            target/surefire-reports/
            reports/
          if-no-files-found: warn

      - name: Build container image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker save "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -o /tmp/image.tar

      - name: Upload image for isolated publish job
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.run_number }}-${{ github.run_attempt }}
          path: /tmp/image.tar
          retention-days: 1

  publish-and-ecr-gate:
    needs: build-and-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGISTRY: ${{ inputs.ECRURL || vars.ECRURL }}
      ECR_REPOSITORY: ${{ inputs.APPREPO || vars.APPREPO }}
      AWS_REGION: ${{ inputs.REGION || vars.REGION }}
      IMAGE_TAG: fb${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.run_number }}-${{ github.run_attempt }}
          path: /tmp/image

      - name: Obtain short-lived AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify repository and basic scanning configuration
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY"
          scan_type=$(aws ecr get-registry-scanning-configuration --query 'scanningConfiguration.scanType' --output text)
          if [[ "$scan_type" != BASIC ]]; then
            echo '::error::This workflow requires ECR BASIC scanning; enhanced scanning needs an Inspector-aware gate.'
            exit 1
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Push image and resolve its immutable digest
        run: |
          docker load -i /tmp/image/image.tar
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Start ECR scan and enforce HIGH/CRITICAL gate
        run: python3 scripts/ecr_scan_gate.py

      - name: Upload ECR scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecr-scan-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/ecr-scan.json
          if-no-files-found: warn
